<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Responsive</title>
<style>
  :root{
    --aspect: 1.91;                 /* ancho / alto */
    --gap: clamp(8px, 2vmin, 20px);  /* separación entre celdas */
    --pad: clamp(8px, 2vmin, 20px);  /* padding del contenedor */
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background:#111; }

  .grid {
    /* ocupa la altura de la pantalla y se centra */
    height: 100vh;
    padding: var(--pad);
    display: grid;
    place-content: center;           /* centra el bloque completo */
    gap: var(--gap);

    /* Calculamos el alto de cada celda para que encaje en alto y ancho */
    --h-by-height: calc((100vh - var(--pad)*2 - var(--gap)) / 2);
    --h-by-width:  calc((100vw - var(--pad)*2 - var(--gap)*2) / (3 * var(--aspect)));
    --h: min(var(--h-by-height), var(--h-by-width));

    grid-template-rows: repeat(2, var(--h));
    grid-template-columns: repeat(3, calc(var(--h) * var(--aspect)));
  }

  .item {
    border: 2px solid #e62;
    background: #222;
    overflow: hidden;
    border-radius: 6px;
  }

  .item img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* rellena sin deformar */
    display: block;
  }
</style>
</head>
<body>
  <div class="grid">
    <div class="item"><img src="../assets/images/index/index1.jpg" alt="img1"></div>
    <div class="item"><img src="../assets/images/index/index2.jpg" alt="img2"></div>
    <div class="item"><img src="../assets/images/index/index3.jpg" alt="img3"></div>
    <div class="item"><img src="../assets/images/index/index4.jpg" alt="img4"></div>
    <div class="item"><img src="../assets/images/index/index5.jpg" alt="img5"></div>
    <div class="item"><img src="../assets/images/index/index6.jpg" alt="img6"></div>
  </div>
</body>
</html>
